<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>webtween demo</title>
    <style>
      body {
        font:
          15px/1.5 system-ui,
          sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1d2433;
        background: #fafbfc;
      }
      form {
        display: grid;
        gap: 0.75rem;
        grid-template-columns: max-content 1fr;
        align-items: center;
      }
      button {
        grid-column: 2;
        justify-self: start;
        padding: 0.4rem 1.2rem;
      }
      progress {
        width: 100%;
        margin-top: 1rem;
      }
      video {
        width: 100%;
        margin-top: 1rem;
        background: #000;
      }
      pre {
        background: #eef1f5;
        padding: 0.75rem;
        border-radius: 6px;
        min-height: 6em;
      }
    </style>
  </head>
  <body>
    <h1>webtween</h1>
    <p>Slow a clip down with frames generated by RIFE, in this browser. Audio is left out.</p>
    <form id="form">
      <label for="file">Clip</label>
      <input id="file" name="file" type="file" accept="video/*" required />
      <label for="factor">Slower by</label>
      <select id="factor" name="factor">
        <option value="2">2x (half speed)</option>
        <option value="4">4x (quarter speed)</option>
        <option value="8">8x</option>
      </select>
      <label for="start">Only from, to (s)</label>
      <span>
        <input id="start" name="start" type="number" min="0" step="0.1" value="0" />
        <input id="end" name="end" type="number" min="0" step="0.1" value="0" />
        (0 and 0: the whole clip)
      </span>
      <label for="backend">Run on</label>
      <select id="backend" name="backend">
        <option value="auto">WebGPU where available</option>
        <option value="wasm">WebAssembly (CPU)</option>
      </select>
      <button type="submit">Slow it down</button>
    </form>
    <progress id="progress" value="0" max="1"></progress>
    <pre id="status">Pick a clip.</pre>
    <a id="download" hidden>Download the MP4</a>
    <video id="result" controls loop></video>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
