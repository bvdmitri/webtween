name: Model

# Builds the model the package ships, from the hash-pinned Practical-RIFE release, and runs the
# export's tests on it (ONNX against PyTorch). The release workflow calls it; it runs by hand too.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to the commit of the release named beside each.
jobs:
  model:
    name: Export and check the model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tools/export
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run --no-sync webtween-export fetch
      - run: uv run --no-sync webtween-export build
      - run: uv run --no-sync pytest
      - run: cat ../../models/manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: models
          path: models/
          if-no-files-found: error
          retention-days: 7
