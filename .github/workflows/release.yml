name: Release

# One tag releases a version everywhere: pushing vX.Y.Z builds the model (model.yml), stages
# @bvdmitri/webtween X.Y.Z on npm with the model inside and
# provenance (npm trusted publishing, so no token is stored) and creates the GitHub Release from
# the version's CHANGELOG section. A maintainer then approves the staged version on npmjs.com, with
# 2FA, and it goes live; CI cannot approve. Safe to re-run: a version already on npm is not staged
# again, and an existing Release is left alone. See docs/guide/releasing.md.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned to the commit of the release named beside each.
jobs:
  model:
    uses: ./.github/workflows/model.yml

  release:
    name: Publish to npm and GitHub
    needs: model
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Check the tag against the package and the changelog
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          package="$(node -p "require('./packages/webtween/package.json').version")"
          if [ "$version" != "$package" ]; then
            echo "The tag $GITHUB_REF_NAME does not match packages/webtween/package.json ($package)." >&2
            exit 1
          fi
          node tools/release/src/main.ts "$version" > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@bvdmitri/webtween@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
      - if: steps.version.outputs.published == 'false'
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.published == 'false'
        run: pnpm verify
      - if: steps.version.outputs.published == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: models
          path: models/
      # tools/pack copies the model into the package, checking it against its manifest.
      - name: Build the package
        if: steps.version.outputs.published == 'false'
        run: pnpm --filter @bvdmitri/webtween build
      - name: Stage on npm, for a maintainer to approve
        if: steps.version.outputs.published == 'false'
        working-directory: packages/webtween
        run: npm stage publish --provenance --access public
      - name: Create the GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists."
          else
            gh release create "$GITHUB_REF_NAME" --title "webtween ${{ steps.version.outputs.version }}" \
              --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi
